name: Build arm64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: LSFG-Android-Application
          persist-credentials: false

      # CMake expects this library beside the application directory. The pinned
      # revision matches upstream FrankBarretta/LSFG-Android's application revision.
      - name: Check out native library and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: FrankBarretta/lsfg-vk-android
          ref: b55b1820c81294b62c787384462eaef9bb6d6e7d
          path: lsfg-vk-android
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            LSFG-Android-Application/**/*.gradle.kts
            LSFG-Android-Application/gradle.properties
            LSFG-Android-Application/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android build tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build signed arm64 debug APK
        working-directory: LSFG-Android-Application
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Verify APK contents and signature
        working-directory: LSFG-Android-Application
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          apks = sorted(Path("app/build/outputs/apk").rglob("*.apk"))
          print("Generated APKs:", [str(path) for path in apks], flush=True)
          arm64_apks = []
          for path in apks:
              with zipfile.ZipFile(path) as archive:
                  if "lib/arm64-v8a/liblsfg-android.so" in archive.namelist():
                      arm64_apks.append(path)
          if len(arm64_apks) != 1:
              raise SystemExit(f"Expected one arm64 LSFG APK, found {len(arm64_apks)}")
          apk = arm64_apks[0]
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              libraries = [name for name in names if name.startswith("lib/") and name.endswith(".so")]
              if not libraries or any(not name.startswith("lib/arm64-v8a/") for name in libraries):
                  raise SystemExit("APK must contain only arm64-v8a native libraries")
              if "lib/arm64-v8a/liblsfg-android.so" not in names:
                  raise SystemExit("Missing native LSFG library")
              if any(name.lower().endswith((".dll", ".spv", ".dxbc", ".cso")) for name in names):
                  raise SystemExit("APK contains a DLL or standalone shader binaries")
          signer = Path(os.environ["ANDROID_HOME"]) / "build-tools/34.0.0/apksigner"
          subprocess.run([str(signer), "verify", "--verbose", str(apk)], check=True)
          artifact = Path("artifacts/LSFG-Android-arm64-v8a-debug.apk")
          artifact.parent.mkdir(exist_ok=True)
          shutil.copy2(apk, artifact)
          print(f"Verified APK: {apk}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LSFG-Android-arm64-v8a-debug
          path: LSFG-Android-Application/artifacts/LSFG-Android-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
